<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAMI - Resultado de Consulta</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="https://www.pami.org.ar/imagenes/logo_pami.svg" alt="PAMI Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">INSTITUCIONAL</a></li>
                <li><a href="#">SERVICIOS</a></li>
                <li><a href="#">CONTACTO</a></li>
                <li>
                    <div class="emergencias">📞 EMERGENCIAS</div>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <p style="color: #666; font-weight: bold;">Médico/a de cabecera - Consulta Médica</p>
        <h1>RESULTADO DE CARGA</h1>

        <div class="results-wrapper">
            <div class="results-container" id="results">
                <div class="result-item">
                    <span class="result-label">Nombre:</span> <span id="res-nombre"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">Apellido:</span> <span id="res-apellido"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">Número de Documento:</span> <span id="res-dni"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">Número de Afiliación:</span>
                    <span id="res-afiliado" class="result-value"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">Sexo:</span>
                    <span id="res-sexo" class="result-value"></span>
                </div>
            </div>

            <div class="calendar-container">
                <div class="calendar-header" id="calendar-month">Febrero 2026</div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Calendar will be generated by JS -->
                </div>
            </div>
        </div>

        <div class="button-container">
            <a href="index.html" class="btn btn-volver">VOLVER</a>
            <a href="lista.html" class="btn btn-continuar">LISTA</a>
        </div>
    </main>

    <script>
        // Función para obtener parámetros de la URL
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('res-nombre').textContent = params.get('nombre') || 'N/A';
            document.getElementById('res-apellido').innerText = params.get('apellido') || '-';
            document.getElementById('res-dni').innerText = params.get('dni') || '-';
            document.getElementById('res-afiliado').innerText = params.get('afiliado') || '-';
            document.getElementById('res-sexo').innerText = params.get('sexo') || '-';
        }

        // Función simple para generar el calendario
        function generateCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthLabel = document.getElementById('calendar-month');
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();

            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            monthLabel.textContent = `${monthNames[month]} ${year}`;

            const days = ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"];
            days.forEach(d => {
                const dayEl = document.createElement('div');
                dayEl.className = 'day-name';
                dayEl.textContent = d;
                grid.appendChild(dayEl);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            // Espacios en blanco para el primer día
            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                grid.appendChild(empty);
            }

            // Días del mes
            for (let i = 1; i <= lastDate; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day' + (i === today ? ' today' : '');
                day.textContent = i;
                grid.appendChild(day);
            }
        }

        window.onload = () => {
            getQueryParams();
            generateCalendar();
        };
    </script>
</body>

</html>
