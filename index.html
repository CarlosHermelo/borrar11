<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAMI - Consulta Médica</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="https://www.pami.org.ar/imagenes/logo_pami.svg" alt="PAMI Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">INSTITUCIONAL</a></li>
                <li><a href="#">SERVICIOS</a></li>
                <li><a href="#">CONTACTO</a></li>
                <li>
                    <div class="emergencias">📞 EMERGENCIAS</div>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <p style="color: #666; font-weight: bold;">Médico/a de cabecera - Consulta Médica</p>
        <h1>DATOS DEL SOLICITANTE</h1>
        <button type="button" id="btn-tutorial" class="btn-tutorial">Ver Tutorial</button>

        <p class="instruction">
            Ingresá tus datos personales para iniciar la solicitud de tu trámite. Recordá completar todos los campos
            obligatorios.
        </p>

        <form action="resultado.html" method="GET">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Apellido" required>
            </div>

            <div class="form-group">
                <label for="dni">Número de Documento</label>
                <input type="text" id="dni" name="dni" placeholder="N° de Documento" required>
            </div>

            <div class="form-group">
                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo" required>
                    <option value="" disabled selected>Seleccione...</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="afiliado">Número de Afiliación</label>
                <input type="text" id="afiliado" name="afiliado" placeholder="N° de Afiliación" required>
            </div>

            <div class="button-container">
                <button type="reset" class="btn btn-volver">BORRAR</button>
                <button type="submit" class="btn btn-continuar">CONTINUAR</button>
            </div>
        </form>
    </main>
    <script src="guide.js"></script>
</body>

</html>
