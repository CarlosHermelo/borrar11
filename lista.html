<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAMI - Lista de Afiliados</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="https://www.pami.org.ar/imagenes/logo_pami.svg" alt="PAMI Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">INSTITUCIONAL</a></li>
                <li><a href="#">SERVICIOS</a></li>
                <li><a href="#">CONTACTO</a></li>
                <li>
                    <div class="emergencias">📞 EMERGENCIAS</div>
                </li>
            </ul>
        </nav>
    </header>

    <main style="max-width: 900px;">
        <p style="color: #666; font-weight: bold;">Médico/a de cabecera - Consulta Médica</p>
        <h1>LISTA DE AFILIADOS</h1>

        <div class="table-container">
            <table id="afiliados-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Número de Documento</th>
                        <th>Número de Afiliación</th>
                        <th>Sexo</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Rows will be generated by JS -->
                </tbody>
            </table>
        </div>

        <div class="pagination" id="pagination-controls">
            <!-- Pagination buttons will be generated by JS -->
        </div>

        <div class="button-container" style="margin-top: 3rem;">
            <a href="resultado.html" class="btn btn-volver">VOLVER</a>
        </div>
    </main>

    <script>
        const recordsPerPage = 10;
        let currentPage = 1;
        const totalRecords = 60;
        const data = [];

        // Generar 60 registros ficticios
        const nombres = ["Juan", "Maria", "Carlos", "Ana", "Jose", "Laura", "Pedro", "Lucia", "Diego", "Elena"];
        const apellidos = ["Perez", "Gonzalez", "Rodriguez", "Lopez", "Garcia", "Martinez", "Sanchez", "Ramirez", "Torres", "Flores"];

        for (let i = 1; i <= totalRecords; i++) {
            data.push({
                nombre: nombres[i % 10],
                apellido: apellidos[(i + 5) % 10],
                dni: Math.floor(10000000 + Math.random() * 90000000).toString(),
                afiliado: "123456" + i.toString().padStart(8, '0'),
                sexo: (i % 3 === 0) ? "Masculino" : (i % 3 === 1 ? "Femenino" : "Otro")
            });
        }

        function displayTable(page) {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            const start = (page - 1) * recordsPerPage;
            const end = start + recordsPerPage;
            const paginatedItems = data.slice(start, end);

            paginatedItems.forEach(item => {
                const row = `<tr ondblclick="selectRecord('${encodeURIComponent(item.nombre)}', '${encodeURIComponent(item.apellido)}', '${item.dni}', '${item.afiliado}', '${item.sexo}')">
                    <td>${item.nombre}</td>
                    <td>${item.apellido}</td>
                    <td>${item.dni}</td>
                    <td>${item.afiliado}</td>
                    <td>${item.sexo}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });

            updatePagination();
        }

        function selectRecord(nombre, apellido, dni, afiliado, sexo) {
            window.location.href = `resultado.html?nombre=${nombre}&apellido=${apellido}&dni=${dni}&afiliado=${afiliado}&sexo=${sexo}`;
        }

        function updatePagination() {
            const controls = document.getElementById('pagination-controls');
            controls.innerHTML = '';

            const totalPages = Math.ceil(totalRecords / recordsPerPage);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                btn.textContent = i;
                btn.onclick = () => {
                    currentPage = i;
                    displayTable(currentPage);
                };
                controls.appendChild(btn);
            }
        }

        window.onload = () => {
            displayTable(currentPage);
        };
    </script>
</body>

</html>
